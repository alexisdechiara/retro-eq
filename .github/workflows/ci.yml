name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Tests et lint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bibliothèques système pour Slint et OpenSSL (TLS de ureq sous Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libssl-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Tests et exécutable (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p retro-app
      - uses: actions/upload-artifact@v4
        with:
          name: retro-eq-windows-x64
          path: target/release/retro-eq.exe
          if-no-files-found: error

      # Installateur : la recette est dans installateur/construire.ps1 (version lue dans
      # Cargo.toml, Inno Setup installé avec Chocolatey s'il manque sur la machine).
      - name: Mode sans fenêtre (--rendre-son-origine)
        shell: pwsh
        run: |
          # Comme le fait le désinstalleur : on attend la fin du processus et on lit son code.
          # Sans Equalizer APO ni données sur cette machine, il n'y a rien à retirer : code 0.
          $p = Start-Process -FilePath target\release\retro-eq.exe -ArgumentList '--rendre-son-origine' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--rendre-son-origine : code $($p.ExitCode)" }
      - name: Installateur (Inno Setup)
        shell: pwsh
        run: ./installateur/construire.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: retro-eq-installateur-x64
          path: installateur/sortie/*.exe
          if-no-files-found: error
