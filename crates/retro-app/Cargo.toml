[package]
name = "retro-app"
description = "Retro EQ : l'application de bureau"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "retro-eq"
path = "src/main.rs"

[dependencies]
retro-dsp.workspace = true
retro-core.workspace = true
retro-engine.workspace = true
retro-audio.workspace = true
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software"] }
i-slint-backend-winit = "=1.19.1"
image = { version = "0.25", default-features = false, features = ["png"] }
thiserror.workspace = true
# Raccourcis clavier globaux (MIT ou Apache 2.0).
global-hotkey = "0.7"
# Ouvre un lien ou un dossier avec l'appli par défaut du système (MIT).
open = "5"
# La langue du système, pour la langue de départ de l'interface (MIT ou Apache 2.0). Déjà
# présente dans Cargo.lock : Slint s'en sert aussi.
sys-locale = "0.3"
# Sert seulement à connaître le décalage horaire local, pour dater les versions (MIT ou Apache 2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Client HTTP pour la base AutoEQ (MIT ou Apache 2.0). TLS par rustls : pas d'OpenSSL à livrer.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }

# Requête HTTP vers l'API de GitHub pour la vérification des mises à jour (MIT ou Apache 2.0).
# Ailleurs que sous Windows (développement et tests sous Linux) : rustls. Sous Windows, voir
# plus bas : rustls (via `ring`) obligerait à compiler du C, ce que la vérification croisée
# depuis Linux (`clippy --target x86_64-pc-windows-msvc`) ne sait pas faire.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }

# Ce qui n'existe que sous Windows : icône de la barre des tâches, boîte « Ouvrir un fichier »,
# styles de la mini-fenêtre.
[target.'cfg(windows)'.dependencies]
# Sous Windows : Schannel, le TLS du système (certificats de Windows, aucun code C à compiler,
# aucune liste de certificats embarquée). ureq veut qu'on le choisisse dans `http.rs`.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default", "gzip", "json"] }
tray-icon = { version = "0.21", default-features = false }
rfd = { version = "0.15", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
# Moteur de test de Slint : envoie de vrais événements souris sans écran (même version que slint).
i-slint-backend-testing = "=1.19.1"

[build-dependencies]
slint-build = "1.19"

[lints]
workspace = true
