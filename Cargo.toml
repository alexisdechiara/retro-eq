[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/alexisdechiara/retro-eq"
rust-version = "1.85"

[workspace.dependencies]
retro-dsp = { path = "crates/retro-dsp" }
retro-core = { path = "crates/retro-core" }
retro-engine = { path = "crates/retro-engine" }
retro-audio = { path = "crates/retro-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
strip = true
